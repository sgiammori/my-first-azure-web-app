    <!-- Contact Form -->
    <div class="row w-100 justify-content-center align-items-center mt-4">
      <div class="col-12 col-md-8 col-lg-6">
        <form style="background:#f8f9fa;padding:2rem;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
          <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" placeholder="Il tuo nome" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="la-tua@email.com" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Messaggio</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" onclick="event.preventDefault();
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var message = document.getElementById('message').value;
            var mailto = 'mailto:stefano.n78@gmail.com?subject=' + encodeURIComponent('Messaggio dal sito da ' + name) + '&body=' + encodeURIComponent('Nome: ' + name + '\nEmail: ' + email + '\n\nMessaggio:\n' + message);
            window.location.href = mailto;">Invia Messaggio</button>
        </form>
      </div>
    </div>
